# ==============================================================================
# REUSABLE WORKFLOW: Release
# ==============================================================================
# Trunk-based release automation via release-please. By default there are no
# per-repo config files: behaviour comes from release-please's built-in defaults
# plus the `release-type` input, and the version is derived from the latest git
# tag. A repository that releases several packages sets `config-file` or
# `manifest-file` instead, and release-please reads every package's release
# type, versioning and tag format from that config and manifest.
#
# Behaviour:
#   - On every push to the tracked branch, release-please opens/updates a single
#     standing "Release PR" that accumulates the version bump + CHANGELOG.
#   - Merging that Release PR creates the git tag + GitHub Release.
#   - Maintenance / hotfix lines: call this with `target-branch` set to the
#     branch (e.g. a `hotfix/1.4.x` cut from a tag). Each branch keeps its own
#     Release PR and version line, derived from that branch's latest reachable
#     tag — nothing else needs configuring.
#
# Inputs:
#   - target-branch        Branch release-please tracks / releases from (default master).
#   - release-type         release-please strategy: simple (libs + apps), node, php, …
#                          (default simple — CHANGELOG + tag, no version file).
#   - versioning-strategy  default | always-bump-patch | … (default default). Use
#                          always-bump-patch for deployed apps so the version does
#                          not inflate from frequent feature releases.
#   - use-app-token        Mint a GitHub App token instead of GITHUB_TOKEN (see Auth).
#   - config-file          release-please config; setting it or manifest-file
#                          turns on manifest mode, where release-type and
#                          versioning-strategy are ignored.
#   - manifest-file        release-please manifest of each package's version.
#                          In manifest mode either file left unset takes
#                          release-please's default name.
#
# Outputs, from release-please, for gating jobs that ship a release:
#   - release_created      'true' when this run created the release, else 'false'.
#   - tag_name             The release's tag, e.g. v1.4.2 (unset with no release).
#   - version              The release's version, e.g. 1.4.2 (unset with no release).
#   - sha                  The commit the release was tagged at (unset with no release).
#   - paths_released       JSON array of the package paths released by this run.
#   - releases             JSON object keyed by package path, each holding that
#                          release's release_created, tag_name, version and sha.
#
#   In manifest mode the four single-release outputs describe the root package
#   (path .) only.
#
#   A caller gates a job on the release with
#     if: needs.<job>.outputs.release_created == 'true'
#   or, for one package in manifest mode,
#     if: fromJSON(needs.<job>.outputs.releases)['packages/foo'].release_created
#
# Auth:
#   - Default: the automatic GITHUB_TOKEN — fine for repos whose tag is consumed
#     out-of-band (e.g. Packagist/npm webhooks). NOTE: this requires the org/repo
#     to (a) grant the token write access and (b) allow GitHub Actions to create
#     pull requests; both are off by default in hardened orgs.
#   - use-app-token: true mints a GitHub App token so the Release PR and the
#     release tag can TRIGGER downstream workflows (required when the tag fires
#     an artifact/deploy pipeline). It also bypasses the GITHUB_TOKEN
#     PR-creation restriction. The org must expose these secrets and the caller
#     must forward them explicitly under `secrets:`:
#       RELEASE_APP_CLIENT_ID    — GitHub App Client ID
#       RELEASE_APP_PRIVATE_KEY  — GitHub App private key (PEM)
# ==============================================================================
name: Release

# ==============================================================================
# TRIGGER
# ==============================================================================
on:
    workflow_call:
        inputs:
            target-branch:
                description: The branch release-please tracks and releases from
                type: string
                required: false
                default: master
            release-type:
                description: release-please release strategy (e.g. simple, node, php)
                type: string
                required: false
                default: simple
            versioning-strategy:
                description: >-
                    Version bump strategy (default, always-bump-patch, …); use
                    always-bump-patch for deployed apps so versions don't inflate
                type: string
                required: false
                default: default
            use-app-token:
                description: >-
                    Mint a GitHub App token so the Release PR and release tag can trigger
                    downstream workflows (set true for repos whose tag fires an
                    artifact/deploy pipeline)
                type: boolean
                required: false
                default: false
            config-file:
                description: >-
                    release-please config file; setting it or manifest-file releases
                    the packages it lists in manifest mode
                type: string
                required: false
                default: ''
            manifest-file:
                description: >-
                    release-please manifest file; setting it or config-file releases
                    the packages it lists in manifest mode
                type: string
                required: false
                default: ''
        outputs:
            release_created:
                description: "'true' when this run created the release, otherwise 'false'"
                value: ${{ jobs.release.outputs.release_created }}
            tag_name:
                description: The release's tag, unset when no release was created
                value: ${{ jobs.release.outputs.tag_name }}
            version:
                description: The release's version, unset when no release was created
                value: ${{ jobs.release.outputs.version }}
            sha:
                description: The commit the release was tagged at, unset when no release was created
                value: ${{ jobs.release.outputs.sha }}
            paths_released:
                description: JSON array of the package paths this run released
                value: ${{ jobs.release.outputs.paths_released }}
            releases:
                description: >-
                    JSON object keyed by package path, holding each released package's
                    release_created, tag_name, version and sha
                value: ${{ jobs.release.outputs.releases }}
        secrets:
            RELEASE_APP_CLIENT_ID:
                description: GitHub App Client ID, required when use-app-token is true
                required: false
            RELEASE_APP_PRIVATE_KEY:
                description: GitHub App private key (PEM), required when use-app-token is true
                required: false

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: write
    pull-requests: write

# ==============================================================================
# CONCURRENCY
# ==============================================================================
# Serialise release runs per branch so rapid pushes can't race on the standing
# Release PR. Never cancel in-flight runs — one may be cutting a tag/release.
concurrency:
    group: release-please-${{ inputs.target-branch }}
    cancel-in-progress: false

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: RELEASE PLEASE
    # ==========================================================================
    release:
        name: Release Please
        runs-on: ubuntu-latest

        outputs:
            release_created: ${{ steps.release-please.outputs.release_created || 'false' }}
            tag_name: ${{ steps.release-please.outputs.tag_name }}
            version: ${{ steps.release-please.outputs.version }}
            sha: ${{ steps.release-please.outputs.sha }}
            paths_released: ${{ steps.release-please.outputs.paths_released || '[]' }}
            releases: ${{ steps.releases.outputs.releases || '{}' }}

        env:
            MANIFEST_MODE: ${{ inputs.config-file != '' || inputs.manifest-file != '' }}

        steps:
            -   name: Mint app token
                id: app-token
                if: ${{ inputs.use-app-token }}
                uses: actions/create-github-app-token@v3
                with:
                    client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
                    private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                    permission-contents: write
                    permission-pull-requests: write

            -   name: Release Please
                id: release-please
                uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
                with:
                    token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
                    # A release-type makes the action ignore the config and manifest.
                    release-type: ${{ env.MANIFEST_MODE != 'true' && inputs.release-type || '' }}
                    versioning-strategy: ${{ env.MANIFEST_MODE != 'true' && inputs.versioning-strategy || '' }}
                    config-file: ${{ inputs.config-file }}
                    manifest-file: ${{ inputs.manifest-file }}
                    target-branch: ${{ inputs.target-branch }}

            # The action names a non-root package's outputs <path>--<key>, which a
            # reusable workflow cannot declare, so they are folded into one object.
            # Gated on a release because a run that updates the release PR adds its
            # whole body to the outputs, which can exceed the env var size limit.
            -   name: Collect releases
                id: releases
                if: steps.release-please.outputs.releases_created == 'true'
                env:
                    OUTPUTS: ${{ toJSON(steps.release-please.outputs) }}
                run: |
                    releases=$(jq -c '
                        . as $out
                        | (.paths_released // "[]" | fromjson)
                        | map(. as $path
                            | (if $path == "." then "" else $path + "--" end) as $prefix
                            | {
                                key: $path,
                                value: {
                                    release_created: true,
                                    tag_name: $out[$prefix + "tag_name"],
                                    version: $out[$prefix + "version"],
                                    sha: $out[$prefix + "sha"]
                                }
                            })
                        | from_entries
                    ' <<<"$OUTPUTS")
                    echo "releases=$releases" >>"$GITHUB_OUTPUT"
